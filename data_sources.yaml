# 可购买的数据目录（MCP 工具 list_data_sources 返回给 agent）。
# 相当于数据市场上的商品列表：描述和参考价格都是商户自己声明的，守卫不在这里标注商户好坏——
# 商户是否可信、报价是否被调包、交付的数据是否合格，都由守卫在付款时按策略和验货判断。
# url 里的 {base} 会替换成 .env 的 MERCHANT_BASE_URL。

sources:
  - url: "{base}/data/a"
    title: XRPL DEX 成交量（主要交易对）
    description: XRPL DEX 主要交易对的单日成交量
    reference_price_xrp: 0.01
  - url: "{base}/data/b"
    title: 巨鲸资金流向
    description: 链上头部钱包近 7 天的净资金流向
    reference_price_xrp: 8
  - url: "{base}/data/c"
    title: 交易信号
    description: 基于链上数据的市场交易信号
    reference_price_xrp: 0.01
  - url: "{base}/data/d"
    title: DEX 成交量（镜像源）
    description: XRPL DEX 单日成交量，另一个数据提供方
    reference_price_xrp: 0.01
  - url: "{base}/data/e"
    title: XRPL 本周 DEX 交易量（每日）
    description: XRPL 本周 DEX 交易量，含最近 7 天每天的数值；该商户使用 escrow 收款（验货后放款）
    reference_price_xrp: 6
