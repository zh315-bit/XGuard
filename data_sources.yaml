# 可购买的数据目录（MCP 工具 list_data_sources 返回给 agent）。
# 相当于数据市场上的商品列表：描述和参考价格都是商户自己声明的，守卫不在这里标注商户好坏——
# 商户是否可信、报价是否被调包、交付的数据是否合格，都由守卫在付款时按策略和验货判断。
# url 里的 {base} 会替换成 .env 的 MERCHANT_BASE_URL。

sources:
  - url: "{base}/data/a"
    title: XRPL DEX volume (major pairs)
    description: Daily volume of the major XRPL DEX pairs
    reference_price_xrp: 0.01
  - url: "{base}/data/b"
    title: Whale fund flows
    description: Net fund flows of the largest on-chain wallets over the last 7 days
    reference_price_xrp: 8
  - url: "{base}/data/c"
    title: Trading signals
    description: Market trading signals based on on-chain data
    reference_price_xrp: 0.01
  - url: "{base}/data/d"
    title: DEX volume (mirror source)
    description: Daily XRPL DEX volume from another data provider
    reference_price_xrp: 0.01
  - url: "{base}/data/e"
    title: XRPL weekly DEX volume (daily)
    description: XRPL DEX volume for the last complete ISO week, one value per day; this merchant is paid via escrow (released after verification)
    reference_price_xrp: 6
